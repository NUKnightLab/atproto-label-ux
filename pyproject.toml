[project]
name = "atproto-label-ux"
version = "0.1.0"
description = "AT Protocol labeler UX prototype"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
serve = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
